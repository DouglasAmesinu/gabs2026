      const inp=document.getElementById("t-input");
      const goBtn=document.getElementById("t-go");
      if(inp){inp.oninput=e=>{ticketInput=e.target.value.toUpperCase();};inp.addEventListener("keydown",e=>{if(e.key==="Enter")checkTicket();});setTimeout(()=>inp.focus(),150);}
      goBtn?.addEventListener("click",checkTicket);
    }
    else if(stage==="already"){
      document.getElementById("a-continue")?.addEventListener("click",()=>{
        me={...foundParticipant};localStorage.setItem("gabs_me",JSON.stringify(me));
        if(!participants.find(p=>p.id===me.id))participants.push({...me});
        el.style.opacity="0";el.style.transition="opacity .3s";
        setTimeout(()=>{el.remove();renderApp();startInbox();},300);
      });
      document.getElementById("a-back")?.addEventListener("click",()=>{stage="enter";ticketInput="";render();});
    }
    else if(stage==="invalid"){document.getElementById("i-back")?.addEventListener("click",()=>{stage="enter";render();});}
    else if(stage==="claim")bindClaimForm();
  }

  async function checkTicket(){
    const val=(document.getElementById("t-input")?.value||"").trim().toUpperCase();
    if(!val){const err=document.getElementById("t-err");if(err)err.innerHTML=`<div class="err-msg" style="margin-top:10px">Please enter your ticket reference.</div>`;return;}
    ticketInput=val;stage="checking";render();
    if(!window._fb){stage="invalid";render();return;}
    try{
      const fbs=window._fb;
      const claimed=await fbs.getDocs(fbs.query(fbs.collection(fbs.db,"participants"),fbs.where("ticket","==",ticketInput)));
      if(!claimed.empty){foundParticipant={id:claimed.docs[0].id,...claimed.docs[0].data()};stage="already";render();return;}
      if(!validTicketRefs.includes(ticketInput)){stage="invalid";render();return;}
      stage="claim";render();
    }catch(e){stage="invalid";render();}
  }

  function bindClaimForm(){
    document.getElementById("c-back")?.addEventListener("click",()=>{stage="enter";render();});
    // Bind interest chip toggles
    document.querySelectorAll(".interest-chip").forEach(chip=>{
      chip.onclick=()=>chip.classList.toggle("sel");
    });
    // Bio character counter
    const bioInp=document.getElementById("c-bio");
    const bioCount=document.getElementById("c-bio-count");
    if(bioInp&&bioCount){
      bioInp.oninput=()=>{bioCount.textContent=`${bioInp.value.length} / 200`;bioCount.style.color=bioInp.value.length>180?"var(--red)":"var(--muted)";};
    }
    document.getElementById("c-sector")?.addEventListener("change",e=>{
      const otherInp=document.getElementById("c-sector-other");
      if(otherInp)otherInp.style.display=e.target.value==="Other"?"block":"none";
    });
    buildCountryPicker("c-country-btn","c-country-wrap","");

    const cPhotoWrap=document.getElementById("c-photo-wrap");
    const cPhotoInput=document.getElementById("c-photo-input");
    const cPhotoStatus=document.getElementById("c-photo-status");
    let pendingPhotoFile=null;

    cPhotoWrap?.addEventListener("click",()=>cPhotoInput?.click());

    cPhotoInput?.addEventListener("change",(e)=>{
      const file=e.target.files[0];
      if(!file)return;
      if(file.size>5*1024*1024){
        if(cPhotoStatus)cPhotoStatus.textContent="Photo must be under 5MB";
        return;
      }
      pendingPhotoFile=file;
      const reader=new FileReader();
      reader.onload=ev=>{
        if(cPhotoWrap)cPhotoWrap.innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/><div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.45);color:#fff;font-size:9px;font-weight:700;text-align:center;padding:4px 0;letter-spacing:.05em">CHANGE</div>`;
      };
      reader.readAsDataURL(file);
      if(cPhotoStatus)cPhotoStatus.textContent="✓ Photo selected — will upload on registration";
    });

    document.getElementById("c-submit")?.addEventListener("click",async()=>{
      const salutation=document.getElementById("c-salutation")?.value||"";
      const ptype=document.getElementById("c-ptype")?.value||"";
      const name=document.getElementById("c-name")?.value.trim();
      const company=document.getElementById("c-company")?.value.trim();
      const website=document.getElementById("c-website")?.value.trim()||"";
      const title=document.getElementById("c-title")?.value.trim();
      const sectorRaw=document.getElementById("c-sector")?.value;
      const sectorOther=document.getElementById("c-sector-other")?.value.trim();
      const sector=sectorRaw==="Other"&&sectorOther?sectorOther:sectorRaw;
      const country=document.getElementById("c-country-wrap")?.dataset.value||"";
      const email=document.getElementById("c-email")?.value.trim().toLowerCase()||"";
      const linkedin=document.getElementById("c-linkedin")?.value.trim()||"";
      const interests=[...document.querySelectorAll(".interest-chip.sel")].map(c=>c.dataset.interest);
      const bio=document.getElementById("c-bio")?.value.trim()||"";
      const fb2=document.getElementById("c-feedback");
      if(!salutation||!ptype||!name||!company||!title||!sector||!country){if(fb2)fb2.innerHTML=`<div class="err-msg">Please fill in all required fields.</div>`;return;}
      if(email&&!email.includes("@")){if(fb2)fb2.innerHTML=`<div class="err-msg">Please enter a valid email address.</div>`;return;}
      if(!window._fb)return;
      const btn=document.getElementById("c-submit");
      try{
        const fbs=window._fb;
        const recheck=await fbs.getDocs(fbs.query(fbs.collection(fbs.db,"participants"),fbs.where("ticket","==",ticketInput)));
        if(!recheck.empty){if(fb2)fb2.innerHTML=`<div class="err-msg">This ticket was just claimed. Please contact AHK Ghana.</div>`;return;}
        if(btn){btn.disabled=true;btn.textContent="Submitting…";}
        const docRef=await fbs.addDoc(fbs.collection(fbs.db,"participants"),{
          salutation,ptype,name,company,website,title,sector,country,email,linkedin,interests,bio,ticket:ticketInput,
          av:initials(name),status:"approved",registeredAt:fbs.serverTimestamp(),source:"ticket-claim",
        });
        if(email)sendConfirmationEmail({name,email,company,title,ticket:ticketInput,status:"approved"});
        me={id:docRef.id,salutation,ptype,name,company,website,title,sector,country,email,linkedin,interests,bio,av:initials(name),status:"approved"};
        localStorage.setItem("gabs_me",JSON.stringify(me));
        if(pendingPhotoFile&&window._storage){
          try{
            const st=window._storage;
            const storageRef=st.ref(st.storage,`photos/${docRef.id}`);
            await st.uploadBytes(storageRef,pendingPhotoFile);
            const url=await st.getDownloadURL(storageRef);
            await window._fb.updateDoc(window._fb.doc(window._fb.db,"participants",docRef.id),{photoURL:url});
            me.photoURL=url;
            localStorage.setItem("gabs_me",JSON.stringify(me));
          }catch(photoErr){
            console.warn("Photo upload failed during registration:",photoErr);
          }
        }
        if(!participants.find(p=>p.id===me.id))participants.push({...me});
        if(fb2)fb2.innerHTML=`<div class="ok-msg">✓ Welcome to GABS 2026, ${esc(name)}! Taking you to the app…</div>`;
        if(btn)btn.textContent="✓ Confirmed";
        setTimeout(()=>{
          const entryEl=document.getElementById("entry");
          if(entryEl){entryEl.style.opacity="0";entryEl.style.transition="opacity .3s";setTimeout(()=>{entryEl.remove();renderApp();startInbox();},350);}
          else{renderApp();startInbox();}
        },900);
      }catch(e){
        if(fb2)fb2.innerHTML=`<div class="err-msg">Submission failed. Please try again.</div>`;
        if(btn){btn.disabled=false;btn.textContent="Confirm & Enter App →";}
      }
    });
  }

  document.body.appendChild(el);
  render();
}

// ── Admin panel ────────────────────────────────────────────────────────────
function showAdmin(){
  const ov=makeOv();
  let adminTab="pending";
  async function renderMain(){
    ov.innerHTML=`<div class="sheet" style="padding-bottom:calc(22px + var(--safe-b))">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div style="font-size:17px;font-weight:800;color:var(--text)">⚙️ Admin Panel</div>
        <button class="btn-outline btn-sm" id="a-cl">Close</button>
      </div>
      <div style="display:flex;background:#F3F4F6;border-radius:12px;padding:3px;margin-bottom:16px">
        <div id="at-pending" style="flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:all .2s;${adminTab==="pending"?"background:#fff;color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.08)":"color:var(--muted)"}">Pending ${pendingRegs.length>0?`<span style="background:#DC2626;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px">${pendingRegs.length}</span>`:""}
        </div>
        <div id="at-parts" style="flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:all .2s;${adminTab==="participants"?"background:#fff;color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.08)":"color:var(--muted)"}">Participants</div>
      </div>
      <div id="admin-body"></div>
    </div>`;
    document.getElementById("a-cl").onclick=()=>ov.remove();
    document.getElementById("at-pending").onclick=()=>{adminTab="pending";renderAdminBody();};
    document.getElementById("at-parts").onclick=()=>{adminTab="participants";renderAdminBody();};
    renderAdminBody();
  }
  function renderAdminBody(){
    const body=document.getElementById("admin-body");if(!body)return;
    if(adminTab==="pending")renderPendingBody(body);
    else renderPartsBody(body);
  }
  function renderPendingBody(body){
    if(!pendingRegs.length){body.innerHTML=`<div style="text-align:center;padding:32px 0;color:var(--muted);font-size:14px">✓ No pending registrations</div>`;return;}
    body.innerHTML=pendingRegs.map(p=>`<div style="background:#F9FAFB;border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:10px">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
        ${avHTML(p.av||initials(p.name||"?"),38,p.photoURL)}
        <div><div style="font-weight:700;color:var(--text)">${esc(p.name)}</div><div style="color:var(--muted);font-size:12px">${esc(p.title||"")} · ${esc(p.company||"")}</div><div style="color:var(--steel);font-size:11px">${esc(p.email||"")} · ${esc(p.country||"")}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn-outline btn-sm" style="color:var(--red);border-color:#FECACA" data-id="${p.id}" id="rej-${p.id}">Reject</button>
        <button class="btn-navy btn-sm" style="color:#fff" data-id="${p.id}" id="apr-${p.id}">Approve</button>
      </div>
    </div>`).join("");
    pendingRegs.forEach(p=>{
      document.getElementById(`apr-${p.id}`)?.addEventListener("click",async()=>{if(!window._fb)return;await window._fb.updateDoc(window._fb.doc(window._fb.db,"participants",p.id),{status:"approved"});});
      document.getElementById(`rej-${p.id}`)?.addEventListener("click",async()=>{if(!window._fb)return;await window._fb.deleteDoc(window._fb.doc(window._fb.db,"participants",p.id));});
    });
  }
  function renderPartsBody(body){
    body.innerHTML=`<div style="display:flex;flex-direction:column;gap:9px">
      <button class="btn-navy" id="a-up" style="color:#fff">↑ Upload participant CSV</button>
      <button class="btn-navy" id="a-tickets" style="color:#fff">🎫 Upload ticket references</button>
      <button class="btn-outline" id="a-exp">↓ Export participant CSV</button>
      <button class="btn-outline" id="a-qr">📱 Show QR Code</button>
      <button class="btn-outline" id="a-dl">↓ CSV Template</button>
      <div id="a-fb"></div>
      <button class="btn-outline" id="a-rst" style="color:var(--red);border-color:#FECACA">Reset all data</button>
      <div style="font-size:11px;color:var(--muted);text-align:center">Columns: name, company, sector, country, title, email</div>
    </div>
    <input type="file" id="a-csv" accept=".csv" style="display:none"/>
    <input type="file" id="tickets-file" accept=".csv,.txt" style="display:none"/>`;
    document.getElementById("a-up").onclick=()=>document.getElementById("a-csv").click();
    document.getElementById("a-csv").onchange=async e=>{
      const f=e.target.files[0];if(!f)return;
      const reader=new FileReader();
      reader.onload=async ev=>{
        try{
          const lines=ev.target.result.trim().split("\n").filter(l=>l.trim());
          if(lines.length<2)throw new Error("Need header + 1 row");
          const hdrs=lines[0].split(",").map(h=>h.trim().toLowerCase().replace(/"/g,""));
          const miss=["name","company","sector","country","title"].filter(x=>!hdrs.includes(x));
          if(miss.length)throw new Error("Missing columns: "+miss.join(", "));
          const parsed=lines.slice(1).map((line,i)=>{
            const vals=line.split(",").map(v=>v.trim().replace(/"/g,""));
            const row=Object.fromEntries(hdrs.map((h,idx)=>[h,vals[idx]||""]));
            return{...row,av:initials(row.name||"?"),status:"approved",source:"csv",_idx:i};
          }).filter(p=>p.name);
          const fb2=document.getElementById("a-fb");
          if(fb2)fb2.innerHTML=`<div class="ok-msg">⏳ Syncing ${parsed.length} participants…</div>`;
          if(window._fb){const fbs=window._fb;await Promise.all(parsed.map((p,i)=>fbs.setDoc(fbs.doc(fbs.db,"participants",`csv_${i}`),{...p,id:`csv_${i}`})));if(fb2)fb2.innerHTML=`<div class="ok-msg">✓ ${parsed.length} participants synced</div>`;}
        }catch(err){const fb2=document.getElementById("a-fb");if(fb2)fb2.innerHTML=`<div class="err-msg">${esc(err.message)}</div>`;}
      };
      reader.readAsText(f);e.target.value="";
    };
    document.getElementById("a-tickets").onclick=()=>document.getElementById("tickets-file").click();
    document.getElementById("tickets-file").onchange=async e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=async ev=>{
        const refs=ev.target.result.split(/[\n,]/).map(r=>r.trim().toUpperCase()).filter(Boolean);
        const fb2=document.getElementById("a-fb");
        if(window._fb){
          try{await window._fb.setDoc(window._fb.doc(window._fb.db,"config","tickets"),{refs,updatedAt:window._fb.serverTimestamp()});validTicketRefs=refs;localStorage.setItem("gabs_tickets",JSON.stringify(refs));if(fb2)fb2.innerHTML=`<div class="ok-msg">✓ ${refs.length} ticket refs synced to all devices</div>`;}
          catch(err){if(fb2)fb2.innerHTML=`<div class="err-msg">Sync failed: ${esc(err.message)}</div>`;}
        }
      };
      r.readAsText(f);e.target.value="";
    };
    document.getElementById("a-exp").onclick=()=>{
      const rows=[["name","company","sector","country","title","email","status","source"],...participants.map(p=>[p.name,p.company,p.sector,p.country,p.title,p.email||"",p.status||"approved",p.source||"csv"])];
      const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
      const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download=`GABS2026_participants_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();document.body.removeChild(a);
    };
    document.getElementById("a-qr").onclick=showQR;
    document.getElementById("a-dl").onclick=()=>{
      const csv=["name,company,sector,country,title,email","Hans Mueller,Berlin Tech GmbH,Technology,Germany,Managing Director,hans@berlintech.de"].join("\n");
      const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="GABS2026_template.csv";document.body.appendChild(a);a.click();document.body.removeChild(a);
    };
    document.getElementById("a-rst").onclick=async()=>{
      const fb2=document.getElementById("a-fb");
      if(!confirm("Delete ALL participants and messages from Firestore? This cannot be undone."))return;
      if(!window._fb){if(fb2)fb2.innerHTML=`<div class="err-msg">Not connected to Firestore.</div>`;return;}
      if(fb2)fb2.innerHTML=`<div class="ok-msg">⏳ Deleting…</div>`;
      try{
        const fbs=window._fb;
        const pSnap=await fbs.getDocs(fbs.collection(fbs.db,"participants"));
        await Promise.all(pSnap.docs.map(d=>fbs.deleteDoc(d.ref)));
        const tSnap=await fbs.getDocs(fbs.collection(fbs.db,"threads"));
        await Promise.all(tSnap.docs.map(async t=>{
          const mSnap=await fbs.getDocs(fbs.collection(fbs.db,"threads",t.id,"messages"));
          await Promise.all(mSnap.docs.map(m=>fbs.deleteDoc(m.ref)));
          await fbs.deleteDoc(t.ref);
        }));
        if(fb2)fb2.innerHTML=`<div class="ok-msg">✓ All data cleared. Returning to start…</div>`;
        await new Promise(r=>setTimeout(r,1500));
        localStorage.clear();
        window.location.reload();
      }catch(e){
        if(fb2)fb2.innerHTML=`<div class="err-msg">Delete failed: ${esc(e.code||e.message||"unknown error")}</div>`;
        console.error("Reset failed:",e);
      }
    };
  }
  document.body.appendChild(ov);
  renderMain();
  ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();});
}

// ── QR ─────────────────────────────────────────────────────────────────────
function showQR(){
  const ov=makeOv(true);
  ov.innerHTML=`<div class="sheet pop" style="max-width:340px;text-align:center">
    <div style="font-size:17px;font-weight:800;color:var(--text);margin-bottom:16px">📱 GABS 2026 App</div>
    <div style="background:var(--navy);border-radius:16px;padding:16px;display:inline-block;margin-bottom:14px">
      <div id="qr-el" style="background:#fff;border-radius:8px;padding:8px"></div>
    </div>
    <div style="font-size:11px;color:var(--muted);word-break:break-all;margin-bottom:16px">${APP_URL}</div>
    <button class="btn-outline" id="qr-cl">Close</button>
  </div>`;
  document.body.appendChild(ov);
  document.getElementById("qr-cl").onclick=()=>ov.remove();
  ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();});
  setTimeout(()=>{if(window.QRCode)new QRCode(document.getElementById("qr-el"),{text:APP_URL,width:180,height:180,colorDark:NAVY,colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});},60);
}

// ── Boot ────────────────────────────────────────────────────────────────────
async function boot(){
  document.getElementById("app").style.display="flex";
  if(window.location.hash==="#admin"){
    window.location.hash="";
    if(window._fb){startParticipantListener();await loadTicketsFromCloud();await new Promise(r=>setTimeout(r,600));}
    document.getElementById("loader").classList.add("gone");
    showAdmin();return;
  }
  if(window._fb){startParticipantListener();await loadTicketsFromCloud();await new Promise(r=>setTimeout(r,600));}
  document.getElementById("loader").classList.add("gone");
  if(!me){showEntry();}
  else{renderApp();startInbox();}
}

if(window._fb){boot();}
else{
  window.addEventListener("fb-ready",boot,{once:true});
  setTimeout(()=>{
    if(!window._fb){
      document.getElementById("loader").innerHTML=`<div style="text-align:center;padding:20px"><div style="color:rgba(255,255,255,.8);font-size:14px;margin-bottom:16px">Connection is slow.<br/>Still trying to connect…</div><button onclick="window.location.reload()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:11px 24px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer">Retry</button></div>`;
      const longWait=setTimeout(()=>{if(!window._fb)boot();},10000);
      window.addEventListener("fb-ready",()=>{clearTimeout(longWait);boot();},{once:true});
    }
  },6000);
}

const qs=document.createElement("script");qs.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";document.head.appendChild(qs);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});


</script>
